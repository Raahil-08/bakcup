<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand bg-white px-4 py-3 shadow-sm">
        <a class="navbar-brand fw-bold" href="index.html">Mini Store</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <a class="nav-link" href="#products">Products</a>
            <span id="userBox"></span>
            <span id="cart" class="badge text-bg-dark">cart: 0</span>
            <button class="btn btn-outline-danger btn-sm" id="clearCartBtn">clear</button>
        </div>
    </nav>

    <!-- HERO -->
    <div class="container text-center py-5 my-4">
        <h1>Mini Store</h1>
        <p>Shop your fav products at great price!</p>
        <a href="#products" class="btn btn-dark btn-lg">shop now</a>
    </div>

    <!-- ADD / EDIT PRODUCT FORM  (Create + Update) -->
    <div class="container mb-4">
        <div class="card p-3">
            <h5 id="formTitle">Add a product</h5>
            <form id="productForm" class="row g-2">
                <div class="col-md-3"><input id="pName" class="form-control" placeholder="name" required></div>
                <div class="col-md-2"><input id="pPrice" type="number" step="0.01" class="form-control" placeholder="price" required></div>
                <div class="col-md-4"><input id="pImage" class="form-control" placeholder="image url (optional)"></div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn btn-dark flex-fill" id="saveBtn">add</button>
                    <button type="button" class="btn btn-outline-secondary d-none" id="cancelBtn">cancel</button>
                </div>
            </form>
            <div id="message" class="mt-2"></div>
        </div>
    </div>

    <!-- SEARCH -->
    <h2 class="text-center fw-bold my-4">our products</h2>
    <div class="container mb-3">
        <input type="text" id="search" class="form-control" placeholder="search">
    </div>

    <!-- PRODUCT LIST  (filled by script.js from the database) -->
    <div class="container">
        <div class="row" id="products"></div>
    </div>

    <!-- DRAG & DROP CART -->
    <div class="container text-center my-4">
        <div class="card p-4" id="dropZone"><h4>drag products here</h4></div>
    </div>

    <!-- GEOLOCATION -->
    <div class="container text-center my-4">
        <button id="locationBtn" class="btn btn-success">get my location</button>
        <p id="locationResult" class="mt-3"></p>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">mini store @2026</footer>
    <script src="script.js"></script>
</body>
</html>
