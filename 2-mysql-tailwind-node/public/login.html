<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Mini Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <nav class="flex items-center justify-between bg-white px-6 py-4 shadow-sm">
        <a href="index.html" class="text-xl font-bold">Mini Store</a>
        <a href="index.html" class="border border-gray-900 px-4 py-1 rounded hover:bg-gray-900 hover:text-white">home</a>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- SIGN UP -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-2xl font-bold mb-4">sign up</h2>
            <form id="signupForm" class="space-y-3">
                <div><label class="block text-sm mb-1">full name</label>
                    <input type="text" id="name" class="w-full border rounded px-3 py-2" required></div>
                <div><label class="block text-sm mb-1">email</label>
                    <input type="email" id="email" class="w-full border rounded px-3 py-2" required></div>
                <div><label class="block text-sm mb-1">phone number</label>
                    <input type="tel" id="phone" class="w-full border rounded px-3 py-2" required></div>
                <div><label class="block text-sm mb-1">password</label>
                    <input type="password" id="password" class="w-full border rounded px-3 py-2" required></div>
                <div><label class="block text-sm mb-1">confirm password</label>
                    <input type="password" id="confirmPassword" class="w-full border rounded px-3 py-2" required></div>
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" id="terms" required> I agree to terms and conditions
                </label>
                <button type="submit" class="w-full bg-gray-900 text-white rounded py-2 hover:bg-gray-700">create account</button>
            </form>
        </div>

        <!-- LOGIN -->
        <div class="bg-white rounded-2xl shadow-lg p-6 self-start">
            <h2 class="text-2xl font-bold mb-4">login</h2>
            <form id="loginForm" class="space-y-3">
                <div><label class="block text-sm mb-1">email</label>
                    <input type="email" id="loginEmail" class="w-full border rounded px-3 py-2" required></div>
                <div><label class="block text-sm mb-1">password</label>
                    <input type="password" id="loginPassword" class="w-full border rounded px-3 py-2" required></div>
                <button type="submit" class="w-full bg-gray-900 text-white rounded py-2 hover:bg-gray-700">login</button>
            </form>
        </div>

    </div>

    <script src="login.js"></script>
</body>
</html>
