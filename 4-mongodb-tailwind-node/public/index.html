<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- NAVBAR -->
    <nav class="flex items-center justify-between bg-white px-6 py-4 shadow-sm">
        <a class="text-xl font-bold" href="index.html">Mini Store</a>
        <div class="flex items-center gap-4">
            <a class="hover:underline" href="#products">Products</a>
            <span id="userBox"></span>
            <span id="cart" class="bg-gray-900 text-white text-sm px-3 py-1 rounded-full">cart: 0</span>
            <button id="clearCartBtn" class="border border-red-500 text-red-500 text-sm px-3 py-1 rounded hover:bg-red-500 hover:text-white">clear</button>
        </div>
    </nav>

    <!-- HERO -->
    <div class="text-center py-16">
        <h1 class="text-4xl font-bold mb-2">Mini Store</h1>
        <p class="mb-6">Shop your fav products at great price!</p>
        <a href="#products" class="bg-gray-900 text-white px-6 py-3 rounded-lg hover:bg-gray-700">shop now</a>
    </div>

    <!-- ADD / EDIT PRODUCT FORM  (Create + Update) -->
    <div class="max-w-5xl mx-auto px-4 mb-8">
        <div class="bg-white rounded-xl shadow p-5">
            <h5 id="formTitle" class="font-semibold mb-3">Add a product</h5>
            <form id="productForm" class="grid grid-cols-1 md:grid-cols-12 gap-2">
                <input id="pName" class="md:col-span-3 border rounded px-3 py-2" placeholder="name" required>
                <input id="pPrice" type="number" step="0.01" class="md:col-span-2 border rounded px-3 py-2" placeholder="price" required>
                <input id="pImage" class="md:col-span-4 border rounded px-3 py-2" placeholder="image url (optional)">
                <div class="md:col-span-3 flex gap-2">
                    <button id="saveBtn" class="flex-1 bg-gray-900 text-white rounded px-3 py-2 hover:bg-gray-700">add</button>
                    <button type="button" id="cancelBtn" class="hidden border rounded px-3 py-2">cancel</button>
                </div>
            </form>
            <div id="message" class="mt-2"></div>
        </div>
    </div>

    <!-- SEARCH -->
    <h2 class="text-center text-2xl font-bold my-6">our products</h2>
    <div class="max-w-5xl mx-auto px-4 mb-4">
        <input type="text" id="search" class="w-full border rounded px-3 py-2" placeholder="search">
    </div>

    <!-- PRODUCT LIST  (filled by script.js from the database) -->
    <div id="products" class="max-w-5xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <!-- DRAG & DROP CART -->
    <div class="max-w-5xl mx-auto px-4 my-8">
        <div id="dropZone" class="text-center bg-white rounded-xl p-8 border-2 border-dashed border-gray-400">
            <h4 class="text-lg font-semibold">drag products here</h4>
        </div>
    </div>

    <!-- GEOLOCATION -->
    <div class="text-center my-8">
        <button id="locationBtn" class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700">get my location</button>
        <p id="locationResult" class="mt-3"></p>
    </div>

    <footer class="bg-gray-900 text-white text-center py-4 mt-12">mini store @2026</footer>
    <script src="script.js"></script>
</body>
</html>
